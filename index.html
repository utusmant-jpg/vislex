<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#111318"/><title>VisLex</title><script>try{var t=localStorage.getItem('vislex-theme');var m=window.matchMedia('(prefers-color-scheme: dark)');document.documentElement.dataset.theme=t==='dark'||t==='light'?t:(m.matches?'dark':'light');document.documentElement.dataset.density=localStorage.getItem('vislex-density')==='compact'?'compact':'comfortable';}catch(e){document.documentElement.dataset.theme='dark';}</script></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
